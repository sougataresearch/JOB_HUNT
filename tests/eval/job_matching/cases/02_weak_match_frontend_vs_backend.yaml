case_name: weak_match_frontend_vs_backend

input:
  candidate_profile:
    full_name: "Sam Rivera"
    skills: ["JavaScript", "React", "CSS", "Figma"]
    experience:
      - title: "Frontend Engineer"
        company: "PixelCraft"
        start_date: "2020"
        end_date: "2024"
        bullets:
          - "Built React component library used across 5 product teams"
          - "Led a design-system migration from CSS to Tailwind"
  job_posting:
    title: "Backend Engineer (Distributed Systems)"
    normalized_description: >
      We need a Backend Engineer with deep Go and Kubernetes experience
      to build our distributed job-scheduling system, plus gRPC and
      PostgreSQL.

golden_response:
  score: 15.0
  matched_requirements: []
  missing_requirements: ["Go", "Kubernetes", "gRPC", "PostgreSQL"]
  red_flags: ["Candidate's entire background is frontend (React/CSS); no backend or distributed-systems experience appears in skills or experience bullets."]
  rationale: >
    The posting requires Go, Kubernetes, gRPC, and PostgreSQL for a
    distributed backend system; the candidate's skills and experience
    are entirely frontend (React, CSS, Figma), with no overlap.

expected_properties:
  score_band: [0, 30]
  insufficient_data: false
