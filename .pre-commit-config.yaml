repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^src/jobhunt_core/
        pass_filenames: false
        args: []
        # The mypy mirror runs in its own isolated venv, so runtime deps
        # used by type-checked modules must be declared here too
        # (kept in sync with pyproject.toml's [project.dependencies] and
        # the mypy dev extra, per rules.md's docs/code-must-not-drift rule).
        additional_dependencies:
          - pydantic>=2.7
          - pydantic-settings>=2.4
          - types-PyYAML>=6.0
          - anthropic>=0.34
          - openai>=1.40
          - httpx>=0.27
          - SQLAlchemy>=2.0
          - alembic>=1.13

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
