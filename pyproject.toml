[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobhunt-core"
version = "0.1.0"
description = "Local-first AI career assistant — core library (agents, LLM layer, storage, document rendering)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "sougataresearch" }]
# License is proposed (MIT) but not yet finalized — decisions.md ADR-0009,
# tasks.md T1.6. Applied here and as a LICENSE file in Phase 18.
dependencies = [
    # Phase 2 (config.md, design.md §8): layered Settings loading.
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    # Phase 3 (decisions.md ADR-0003): LLM provider adapters.
    "anthropic>=0.34",
    "openai>=1.40",
    "httpx>=0.27",
    # Phase 4 (database.md, decisions.md ADR-0002): storage layer.
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    # Phase 5 (tasks.md T5.1-T5.3): CV parsing, prompt rendering, CLI.
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "Jinja2>=3.1",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/sougataresearch/JOB_HUNT"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    # Phase 17 (tasks.md T17.2, rules.md §Dependency Management): CI
    # dependency vulnerability scanning.
    "pip-audit>=2.7",
    # Fixture generation only (tests/fixtures/cvs/_generate.py) -- not used at
    # runtime or imported by the test suite itself.
    "reportlab>=4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunt_core"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "."]
# Recent ruff versions format Python code fences embedded in Markdown by
# default; the illustrative pseudocode in the root-level docs (api.md, etc.)
# is intentionally not strict, runnable Python, so exclude it from linting.
# migrations/versions/ is Alembic-generated boilerplate (script.py.mako's
# template, not our code style) -- regenerated by `alembic revision` each
# time, so it isn't hand-maintained to this project's lint rules.
extend-exclude = ["*.md", "migrations/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
# D203/D211 and D212/D213 are mutually exclusive pydocstyle pairs;
# ignoring the *203/*213 half is the common convention (rules.md §Coding Conventions).
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
# cli/ added in Phase 5 (tasks.md T5.3) alongside src/jobhunt_core -- it
# has real logic (run_setup et al.) worth checking, not just a thin script.
files = ["src/jobhunt_core", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jobhunt_core --cov-report=term-missing"
# cli/ is a top-level, non-installed package (run via `python -m cli.main`
# from the repo root, decisions.md ADR-0004) -- add the repo root to
# sys.path for collection so tests/cli/ can import it the same way.
pythonpath = ["."]
