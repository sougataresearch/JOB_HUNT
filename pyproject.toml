[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobhunt-core"
version = "0.1.0"
description = "Local-first AI career assistant — core library (agents, LLM layer, storage, document rendering)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "sougataresearch" }]
# License is proposed (MIT) but not yet finalized — decisions.md ADR-0009,
# tasks.md T1.6. Applied here and as a LICENSE file in Phase 18.
dependencies = [
    # Phase 2 (config.md, design.md §8): layered Settings loading.
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    # Phase 3 (decisions.md ADR-0003): LLM provider adapters.
    "anthropic>=0.34",
    "openai>=1.40",
    "httpx>=0.27",
    # Phase 4 (database.md, decisions.md ADR-0002): storage layer.
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
]

[project.urls]
Repository = "https://github.com/sougataresearch/JOB_HUNT"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunt_core"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Recent ruff versions format Python code fences embedded in Markdown by
# default; the illustrative pseudocode in the root-level docs (api.md, etc.)
# is intentionally not strict, runnable Python, so exclude it from linting.
# migrations/versions/ is Alembic-generated boilerplate (script.py.mako's
# template, not our code style) -- regenerated by `alembic revision` each
# time, so it isn't hand-maintained to this project's lint rules.
extend-exclude = ["*.md", "migrations/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
# D203/D211 and D212/D213 are mutually exclusive pydocstyle pairs;
# ignoring the *203/*213 half is the common convention (rules.md §Coding Conventions).
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/jobhunt_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jobhunt_core --cov-report=term-missing"
